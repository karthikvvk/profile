<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Karthik Venkatasubramanian Portfolio</title>
    <meta
      name="description"
      content="Portfolio of Karthik Venkatasubramanian — backend engineer building distributed systems, FastAPI services, and P2P networking tools."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/style.css" />
  </head>
  <body>
    <div class="scanline" aria-hidden="true"></div>

    <main class="wrap">
      <!-- ============ HEADER / PROFILE ============ -->
      <header class="header">
        <h1 class="name">Karthik Venkatasubramanian</h1>
        <!-- <p class="title">
          [Your Title — e.g. Backend &amp; Distributed Systems Engineer]
        </p> -->
        <!-- <p class="bio">
          [One or two lines about you — what you build and what you're into.
          e.g. I build relay-based distributed systems and ship them to AWS on a
          free-tier budget.]
        </p> -->

        <nav class="links" aria-label="Profile links">
          <a href="mailto:vkarthik5002@gmail.com">Email</a>
          <a href="https://github.com/karthikvvk" target="_blank" rel="noopener"
            >Github</a
          >
          <a
            href="https://www.linkedin.com/in/karthik-venkatasubramanian/"
            target="_blank"
            rel="noopener"
            >Linkedin</a
          >
          <a
            href="https://drive.google.com/file/d/1NqsZrNPAK8mX45kA8t3MVdWGISEvtEp9/view?usp=sharing"
            target="_blank"
            rel="noopener"
            >Resume</a
          >
          <button
            class="btn-download"
            id="btnDownloadPdf"
            aria-label="Download portfolio as PDF"
          >
            <span aria-hidden="true">⬇</span> Download as PDF
          </button>
        </nav>
      </header>

      <!-- ============ REGISTRY ============ -->
      <section class="registry" aria-labelledby="registry-heading">
        <div class="registry-head">
          <h2 id="registry-heading">Projects</h2>
          <span class="sync-meta" id="syncMeta">connecting to registry…</span>
        </div>

        <div id="registryList" class="registry-list" aria-live="polite">
          <!-- skeleton rows while loading -->
          <div class="row skeleton">
            <div class="pulse-dot idle"></div>
            <div class="skel-line"></div>
          </div>
          <div class="row skeleton">
            <div class="pulse-dot idle"></div>
            <div class="skel-line"></div>
          </div>
          <div class="row skeleton">
            <div class="pulse-dot idle"></div>
            <div class="skel-line"></div>
          </div>
        </div>
      </section>

      <!-- ============ CERTIFICATES ============ -->
      <section class="certs-section" aria-labelledby="certs-heading">
        <div class="section-head">
          <h2 id="certs-heading">Certificates</h2>
        </div>
        <div class="certs-list" id="certsList" aria-live="polite">
          <!-- skeleton while loading -->
          <div class="cert-card skeleton">
            <div class="pulse-dot idle"></div>
            <div class="skel-line"></div>
          </div>
        </div>
      </section>

      <!-- ============ SKILLS ============ -->
      <section class="skills-section" aria-labelledby="skills-heading">
        <div class="section-head">
          <h2 id="skills-heading">Skills</h2>
        </div>
        <div class="skills-pills" id="skillsList" aria-live="polite">
          <!-- populated from data/graph.json -->
        </div>
      </section>

      <!-- ============ EXTRACURRICULARS / HOBBIES ============ -->
      <section class="expand-section" aria-labelledby="extras-heading">
        <button
          class="expand-toggle"
          id="extrasToggle"
          aria-expanded="false"
          aria-controls="extrasPanel"
        >
          <span class="expand-chevron" aria-hidden="true">▶</span>
          <h2 id="extras-heading">Extracurriculars &amp; Hobbies</h2>
          <span class="expand-hint">click to expand</span>
        </button>

        <div class="expand-panel" id="extrasPanel" hidden>
          <div class="extras-grid" id="extrasGrid" aria-live="polite">
            <!-- populated from data/projects.json -->
          </div>
        </div>
      </section>
    </main>

    <!-- ============ CITATION OVERLAY ============ -->
    <div id="citation-overlay" role="dialog" aria-modal="true" hidden></div>

    <script src="assets/graph.js"></script>
    <script src="assets/popup.js"></script>
    <script src="assets/script.js"></script>
  </body>
</html>
